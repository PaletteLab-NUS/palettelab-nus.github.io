# Build on CI and publish to the gh-pages branch.
# Mapbox token stays in a GitHub Actions secret (never committed).
#
# Setup (once):
#   Repo → Settings → Secrets and variables → Actions
#   → New repository secret
#   Name:  REACT_APP_MAPBOX_TOKEN
#   Value: your Mapbox public token (pk.*)
#
# Note: CRA inlines REACT_APP_* into the JS bundle at build time, so the
# public pk.* token will still appear in browser sources. Restrict that
# token by URL in the Mapbox dashboard (this site + localhost).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false
          REACT_APP_MAPBOX_TOKEN: ${{ secrets.REACT_APP_MAPBOX_TOKEN }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          # Keep a .nojekyll so paths with underscores work on Pages
          force_orphan: true
