"Jane L. E":
  name: "Jane L. E"
  description: "Lab Director"
  website: "https://ejane.me/"
  category: "professor"
  image: "janee_purple-480.webp"
  bio: |
    <p>I'm interested in thinking about how to
    design computational tools that can support users in developing domain
    expertise, which I currently explore within the domain of creativity. Inspired by
    how expert artists have trained their eyes to "see" in a certain way, I aim
    to design guidance that helps novices develop their own "artistic vision"—and
    in doing so, support them in developing their own artistic expertise.</p>
    <p>On the side, I am a dancer 🩰, a photo enthusiast 📷, a foodie 🍛, and a lover of fitness 🤸🏻‍♀️. I also love going to craft fairs to discover the work of local artists and designers.</p>
    <p>We are actively looking for students and interns to <a href="https://forms.gle/jhtwNwt2NDhZsEZS9" target="_blank">join the Palette Lab</a>.</p>

