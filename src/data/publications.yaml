  year: 2026
  venue: "Proceedings of the 2026 CHI Conference on Human Factors in Computing Systems"
  venue_short: "CHI 2026"
  location: "Barcelona, Spain"
  abstract: >
    Visual design instructors often provide multi-modal feedback, mixing annotations with text.
    We introduce VizCrit, a system for providing computational feedback that supports the
    actionability spectrum, realized through algorithmic issue detection and visual annotation
    generation. In a between-subjects study (N=36), novices revised a design under one of three
    conditions: textbook-based, awareness-centered, or solution-centered feedback.
